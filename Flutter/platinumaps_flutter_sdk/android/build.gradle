// Android-side build script for the Platinumaps Flutter plugin.
//
// The plugin wraps the existing native Android SDK
// (`Android/platinumaps-sdk/`). For in-repo development the SDK's
// Kotlin sources and resources are added to this plugin's
// `sourceSets` via relative paths, so the plugin compiles as a single
// library module without any pre-built AAR. When publishing to
// pub.dev a release workflow copies those sources into
// `src/main/kotlin/` and `src/main/res/` so the published package
// stands on its own; see DESIGN §8 #4.

group 'jp.co.boldright.platinumaps.flutter'
version '0.1.0'

buildscript {
    // Keep the AGP / Kotlin versions aligned with both the Android
    // sample (`Android/sample/build.gradle`, AGP 8.12.0) and the
    // Flutter example (`Flutter/example/android/settings.gradle.kts`).
    // Bumping past Kotlin 2.0 lets the Compose Compiler plugin in the
    // Android sample stay on `org.jetbrains.kotlin.plugin.compose
    // 2.0.21` without a Kotlin-version mismatch.
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // The R / BuildConfig classes are generated under this namespace.
    // The Kotlin sources we pull in from Android/platinumaps-sdk/ live in
    // `jp.co.boldright.platinumaps.sdk` and reach for `R` / `BuildConfig`
    // unqualified — so we keep the namespace aligned with the SDK
    // package even though the plugin's own glue lives in
    // `jp.co.boldright.platinumaps.flutter` (declared in pubspec.yaml as
    // the Flutter plugin package).
    namespace 'jp.co.boldright.platinumaps.sdk'
    compileSdk 36

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // The vendored SDK sources reach for `BuildConfig.DEBUG`. AGP 8+
        // requires an explicit opt-in to generate the class.
        buildConfig true
    }

    sourceSets {
        main.java.srcDirs += [
            'src/main/kotlin',
            // In-repo development: pull the SDK sources directly so the
            // single library module compiles them in. The publish
            // workflow copies these files into `src/main/kotlin/` before
            // uploading to pub.dev.
            '../../../Android/platinumaps-sdk/src/main/java',
        ]
        main.res.srcDirs += [
            '../../../Android/platinumaps-sdk/src/main/res',
        ]
    }
}

// New-style Kotlin DSL for `jvmTarget`. Equivalent to the older
// `kotlinOptions { jvmTarget = '17' }` but uses the typed
// `JvmTarget.JVM_17` constant Kotlin 2.0+ recommends; the old DSL
// emits a deprecation warning under KGP 2.0.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // Same transitive dependencies the SDK module declares in
    // `Android/platinumaps-sdk/build.gradle`.
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    testImplementation 'junit:junit:4.13.2'
}
